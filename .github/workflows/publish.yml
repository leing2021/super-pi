name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - run: bun test
      - name: Check if version already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @leing2021/super-pi@$VERSION version 2>/dev/null; then
            echo "Version $VERSION already exists on npm, skipping publish."
            echo "skip_publish=true" >> $GITHUB_ENV
          fi
      - name: Preflight — verify NPM_TOKEN is valid before publish
        if: env.skip_publish != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::NPM_TOKEN is invalid or expired. Rotate it: npmjs.com → Access Tokens → generate a granular token with publish permission for @leing2021/super-pi, then update repo Settings → Secrets → NPM_TOKEN. Afterwards rerun this workflow (gh run rerun <run-id>). Do NOT bump the version — an E404'd version was never published."
            exit 1
          fi
      - run: npm publish --access public
        if: env.skip_publish != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
